{% extends "base.html" %}

{% block content %}
    <h1>Delete Listing</h1>

    <p>Are you sure you want to delete this listing?</p>

    <h2>{{ object.title }}</h2>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Yes, delete</button>
        <a href="{% url 'accounts:my_listings' %}">Cancel</a>
    </form>
{% endblock %}
