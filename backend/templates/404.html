<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Page not found</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6f7;
            color: #222;
        }
        .error-wrap {
            max-width: 720px;
            margin: 80px auto;
            padding: 32px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 12px;
        }
        h1 {
            margin-top: 0;
            font-size: 32px;
        }
        p {
            line-height: 1.5;
        }
        a {
            display: inline-block;
            margin-top: 12px;
            padding: 10px 14px;
            border-radius: 8px;
            background: #222;
            color: #fff;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <main class="error-wrap">
        <h1>Page not found</h1>
        <p>The page you requested does not exist, may have moved, or may no longer be available.</p>
        <a href="/">Go to homepage</a>
    </main>
</body>
</html>
