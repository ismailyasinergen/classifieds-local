{% extends "base.html" %}

{% block content %}
    <h1>My Profile</h1>

    <p><strong>Username:</strong> {{ request.user.username }}</p>
    <p><strong>Email:</strong> {{ request.user.email }}</p>

    <p class="storefront-profile-shortcut-v106">
        <a class="button-link" href="{% url 'accounts:seller_store_settings' %}">
            Manage Seller Store
        </a>
    </p>

    <p>
        <a class="button-link" href="{% url 'accounts:notification_delivery_preferences_v288' %}">
            Manage Notification Preferences
        </a>
    </p>

    <p>
        <a class="button-link" href="{% url 'accounts:email_verification_status_v306' %}">
            Manage Email Verification
        </a>
    </p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Save profile</button>
    </form>
{% endblock %}
