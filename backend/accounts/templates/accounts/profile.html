{% extends "base.html" %}

{% block content %}
    <h1>My Profile</h1>

    <p><strong>Username:</strong> {{ request.user.username }}</p>
    <p><strong>Email:</strong> {{ request.user.email }}</p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Save profile</button>
    </form>
{% endblock %}
