server {
    # PRODUCTION_NGINX_SECURITY_HEADERS_V1
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    listen 80;

    client_max_body_size 230M;

    location /static/ {
        # PRODUCTION_NGINX_STATIC_CACHE_V1
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        alias /static/;
    }

    # PROTECT_PRIVATE_MEDIA_PATHS_V59
    # Private uploads must only be served through Django's authenticated
    # private download views. Keep public listing images available below.
    location ^~ /media/appeal_attachments/ {
        return 404;
    }

    location ^~ /media/verification_documents/ {
        return 404;
    }

    location ^~ /media/verification_docs/ {
        return 404;
    }

    location ^~ /media/seller_verification/ {
        return 404;
    }

    location ^~ /media/verification/ {
        return 404;
    }

    location ^~ /media/payment_proofs/ {
        return 404;
    }

    location ^~ /media/payment_receipts/ {
        return 404;
    }

    location ^~ /media/promotion_proofs/ {
        return 404;
    }

    location ^~ /media/promotion_payment_proofs/ {
        return 404;
    }

    location ^~ /media/proofs/ {
        return 404;
    }

    location ^~ /media/receipts/ {
        return 404;
    }

    location /media/ {
        alias /media/;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        # PRODUCTION_NGINX_PROXY_HEADERS_V1
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
