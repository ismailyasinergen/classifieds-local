# CSP_REPORT_EDGE_RATE_ZONE_V336
limit_req_zone $binary_remote_addr zone=csp_reports_v336:10m rate=1r/s;

server {
    # PRODUCTION_NGINX_SECURITY_HEADERS_V1
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    listen 80;

    client_max_body_size 230M;

    location /static/ {
        # PRODUCTION_NGINX_STATIC_CACHE_V1
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        alias /static/;
    }

    # PROTECT_PRIVATE_MEDIA_PATHS_V59
    # Private uploads must only be served through Django's authenticated
    # private download views. Keep public listing images available below.
    location ^~ /media/appeal_attachments/ {
        return 404;
    }

    location ^~ /media/verification_documents/ {
        return 404;
    }

    location ^~ /media/verification_docs/ {
        return 404;
    }

    location ^~ /media/seller_verification/ {
        return 404;
    }

    location ^~ /media/verification/ {
        return 404;
    }

    location ^~ /media/payment_proofs/ {
        return 404;
    }

    location ^~ /media/payment_receipts/ {
        return 404;
    }

    location ^~ /media/promotion_proofs/ {
        return 404;
    }

    location ^~ /media/promotion_payment_proofs/ {
        return 404;
    }

    location ^~ /media/proofs/ {
        return 404;
    }

    location ^~ /media/receipts/ {
        return 404;
    }

    location /media/ {
        alias /media/;
    }

    # NGINX_PROXY_HEADER_CLEANUP_V60
    proxy_headers_hash_max_size 1024;
    proxy_headers_hash_bucket_size 128;

    # CSP_REPORT_EDGE_ABUSE_CONTROL_V336
    # The shared zone is node-local and complements the independently bounded
    # Django receiver. Multi-node deployments still require an upstream,
    # deployment-wide control before approving V335 edge readiness.
    location = /__csp_reports__/ {
        client_max_body_size 16k;
        client_body_timeout 10s;

        limit_req zone=csp_reports_v336 burst=10 nodelay;
        limit_req_status 429;
        limit_req_log_level notice;

        proxy_pass http://web:8000;
        proxy_redirect off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_redirect off;

        proxy_set_header Host $host;
        # PRODUCTION_NGINX_PROXY_HEADERS_V1
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
